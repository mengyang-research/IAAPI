[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaapi"
version = "0.1.0"
description = "Identifiability-aware inference and experimental-design tools for mechanistic ODE models"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{name = "Mengyang Research"}]
keywords = [
    "ordinary-differential-equations",
    "parameter-inference",
    "identifiability",
    "petab",
    "sbml",
    "systems-biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.1",
    "torch-geometric>=2.5",
    "petab>=0.8.2",
    "python-libsbml",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
simulation = ["amici>=0.21", "h5py>=3.9", "tqdm>=4.65"]
training = [
    "pytorch-lightning>=2.1",
    "nflows>=0.14",
    "sbi>=0.22",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
]
validation = ["emcee>=3.1", "scikit-learn>=1.3"]
plot = ["matplotlib>=3.7", "seaborn>=0.12", "plotly>=5.15"]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]
all = [
    "amici>=0.21",
    "h5py>=3.9",
    "tqdm>=4.65",
    "pytorch-lightning>=2.1",
    "nflows>=0.14",
    "sbi>=0.22",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "emcee>=3.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]

[project.scripts]
iaapi = "iaapi.cli:main"

[project.urls]
Homepage = "https://github.com/mengyang-research/IAAPI"
Repository = "https://github.com/mengyang-research/IAAPI"
Issues = "https://github.com/mengyang-research/IAAPI/issues"

[tool.setuptools.packages.find]
include = ["iaapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: tests that compile or run AMICI benchmark models"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "C901"]
