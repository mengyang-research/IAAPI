name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Run fast public tests
        run: >-
          python -m pytest -q
          tests/test_public_api.py
          tests/test_fim_descriptors.py
          tests/test_targets.py
          tests/test_param_alignment.py
          tests/test_intervention.py
